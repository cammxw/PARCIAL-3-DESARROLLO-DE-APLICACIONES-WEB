<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergiaHogar</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#1f2933}
h1{margin-bottom:.2rem}
.sub{color:#52606d;margin-top:0}
table{width:100%;border-collapse:collapse;margin:1rem 0}
th,td{padding:.5rem;border-bottom:1px solid #d9e2ec;text-align:left}
.fila input{width:31%;box-sizing:border-box}
input{padding:.4rem;margin:.15rem;border:1px solid #9fb3c8;border-radius:4px}
button,.boton{background:#0b6e4f;color:#fff;border:0;border-radius:4px;padding:.5rem 1rem;cursor:pointer;text-decoration:none;display:inline-block}
.error{background:#fde8e8;color:#9b1c1c;padding:.7rem;border-radius:4px}
.tarjeta{background:#f0f4f8;padding:1rem;border-radius:6px;margin:1rem 0}
.barra{background:#0b6e4f;height:10px;border-radius:5px}
</style>
</head>
<body>
<h1>EnergiaHogar</h1>
<p class="sub">Estima el consumo de tus equipos y simula cuanto ahorrarias</p>
{% block contenido %}{% endblock %}
</body>
</html>
